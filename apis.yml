apis:
- aid: seon-tech:device-intelligence
  name: SEON Device Intelligence
  description: >-
    SEON Device Intelligence is the device-fingerprinting product surfaced through JavaScript, iOS, Android,
    Flutter, React Native, Cordova, and Unity SDKs. Captured device signals (True Device ID, hashes, behavioral
    biometrics, geolocation, remote-access detection, residential-proxy and VPN detection) are returned
    via the Fraud API or User Session Monitoring stream.
  humanURL: https://docs.seon.io/knowledge-base/device-intelligence/device-intelligence-overview
  tags:
  - Device Fingerprinting
  - Device Intelligence
  - Fraud Prevention
