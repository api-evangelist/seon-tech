aid: seon-tech
name: SEON
description: SEON is a Budapest-headquartered fraud prevention, AML compliance, and digital footprint
  analysis platform that exposes a modular REST API for fraud scoring, identity verification, email enrichment,
  phone enrichment, IP intelligence, BIN lookup, AML screening, device intelligence, and identity verification
  (IDV). SEON combines real-time enrichment of email, phone, IP, BIN, and device signals with customer-defined
  rules and machine learning to score risk and prevent fraud, account takeover, multi-accounting, and
  money laundering across digital channels.
